<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Card Manager</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }

        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #0f172a;
            font-family: -apple-system, 'Helvetica Neue', 'Roboto', Arial, sans-serif;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        #root {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .flex-center { display: flex; align-items: center; justify-content: center; }

        .section-container {
            flex: 1;
            display: flex; flex-direction: column;
            overflow: hidden; min-height: 0;
        }

        .section-title {
            height: 20px; font-size: 11px; font-weight: 800;
            padding: 0 8px; display: flex; align-items: center;
            flex-shrink: 0; letter-spacing: 0.3px;
        }

        .row-item {
            display: flex; align-items: center;
            min-height: 28px; height: 3.8%;
            padding: 0 3px; border-bottom: 1px solid #0f172a;
            flex-shrink: 0;
        }

        /* pit-name: 4글자(8-1P, 10-1)도 안전하게 */
        .pit-name {
            width: 32px; min-width: 32px;
            font-size: 11px; font-weight: 800; color: #e2e8f0;
            white-space: nowrap; overflow: hidden; flex-shrink: 0;
            letter-spacing: -0.5px; text-align: center;
        }

        /* ◀ 화살표: 별도 div */
        .arrow-indicator {
            width: 10px; min-width: 10px;
            font-size: 8px; color: #60a5fa; font-weight: 900;
            flex-shrink: 0; text-align: center;
        }

        /* from 표시: 위아래로 */
        .from-indicator {
            width: 26px; min-width: 26px;
            font-size: 7px; font-weight: 800; color: #60a5fa;
            overflow: hidden;
            display: flex; flex-direction: column;
            align-items: flex-start; justify-content: center;
            flex-shrink: 0; line-height: 1.2;
        }

        .count-box {
            width: 26px; min-width: 26px; height: 20px;
            border-radius: 4px; font-size: 12px; font-weight: 900;
            margin-right: 3px;
            cursor: pointer; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .reset-zone {
            width: 14px; min-width: 14px; height: 20px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; color: #475569; font-size: 13px;
            flex-shrink: 0; touch-action: manipulation;
        }

        .subtotal-bar {
            height: 20px; font-size: 11px; font-weight: 900;
            background: #0f172a; border-top: 1px solid #334155;
            display: flex; justify-content: space-around; align-items: center;
            flex-shrink: 0;
        }

        .scroll-area {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }

        select {
            width: 32px; height: 20px;
            font-size: 8px; font-weight: 800;
            border: 1px solid #1d4ed8; border-radius: 3px;
            background: #1e3a5f; color: #93c5fd;
            text-align: center; text-align-last: center;
            -webkit-appearance: none; -moz-appearance: none; appearance: none;
            padding: 0; outline: none; flex-shrink: 0;
            touch-action: manipulation;
        }

        button {
            cursor: pointer; font-family: inherit;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            border: none; outline: none;
        }

        .group-divider { border-top: 2px solid #334155; }
    </style>
</head>
<body>
<div id="root"></div>
<script>
const F2_LIST   = ["1-1","1-2","3-1","3-2","3-3","5-1","5-2","9-1","9-2","9-3","9-4","10-1"];
const BJPK_LIST = ["1-2","6-1","8-1","8-1P","21-2"];
const F3_LIST   = ["21-1","21-2","68-1","68-2","68-3","68-4","38-2","88-1","88-2","88-3","88-4","88-5","88-6","91-1","91-2","91-3","91-5","91-6","91-7","91-8","99-1","99-2","99-3","99-4","99-5"];

const F2_GROUPS = [
    ["1-1","1-2"], ["3-1","3-2","3-3"], ["5-1","5-2"],
    ["9-1","9-2","9-3","9-4"], ["10-1"],
];
const F3_GROUPS = [
    ["21-1","21-2"],
    ["68-1","68-2","68-3","68-4"],
    ["38-2"],
    ["88-1","88-2","88-3","88-4","88-5","88-6"],
    ["91-1","91-2","91-3","91-5","91-6","91-7","91-8"],
    ["99-1","99-2","99-3","99-4","99-5"],
];

const BC_KEYS   = [...new Set([...F2_LIST, ...F3_LIST])].map(t => `p_${t}`);
const BJPK_KEYS = BJPK_LIST.map(t => `k_${t}`);
const BC_SORTED = [...F2_LIST, ...F3_LIST].filter((v,i,a) => a.indexOf(v) === i);
const BJPK_SORTED = [...BJPK_LIST];

let data = makeData();
let flash = null, flashTimer = null;
let locked = false, confirmingReset = false;

function makeData() {
    const d = {};
    BC_KEYS.forEach(k   => { d[k] = { blue:0, red:0, to:"" }; });
    BJPK_KEYS.forEach(k => { d[k] = { bj:0,  pk:0,  to:"" }; });
    return d;
}

function getBCFromMap() {
    const m = {};
    BC_KEYS.forEach(k => {
        const to = data[k].to;
        if (to) { (m[`p_${to}`] = m[`p_${to}`] || []).push(k.replace('p_','')); }
    });
    return m;
}
function getBJFromMap() {
    const m = {};
    BJPK_KEYS.forEach(k => {
        const to = data[k].to;
        if (to) { (m[`k_${to}`] = m[`k_${to}`] || []).push(k.replace('k_','')); }
    });
    return m;
}

function calcBC(list, f) { return list.reduce((s,t) => s+(data[`p_${t}`]?.[f]||0), 0); }
function calcBJ(f)        { return BJPK_LIST.reduce((s,t) => s+(data[`k_${t}`]?.[f]||0), 0); }

function tap(key, field) {
    if (locked) return;
    data[key][field]++;
    flash = `${key}_${field}`;
    if (flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(() => { flash = null; render(); }, 120);
    render();
}
function resetRow(key, f0, f1) {
    if (locked) return;
    data[key][f0] = 0; data[key][f1] = 0; render();
}
function setTo(key, val) { data[key].to = val; render(); }
function toggleConfirmReset() { if (locked) return; confirmingReset = !confirmingReset; render(); }
function doReset() { if (locked) return; data = makeData(); confirmingReset = false; render(); }
function toggleLock() { locked = !locked; if (locked) confirmingReset = false; render(); }

function el(tag, attrs, ...children) {
    const e = document.createElement(tag);
    if (attrs) Object.entries(attrs).forEach(([k,v]) => {
        if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
        else if (k === 'className') e.className = v;
        else if (k === 'disabled') e.disabled = v;
        else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
        else e.setAttribute(k, v);
    });
    children.flat(9).forEach(c => {
        if (c == null || c === false || c === '') return;
        e.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
    });
    return e;
}

// 컬럼 헤더: pit(30) + arrow(10) + from(24) + flex + box(26+3)*2 + select(32) + reset(14)
function makeColHeader(label, labelColor, l0, c0, l1, c1) {
    return el('div', { style:{ display:'flex', height:'18px', alignItems:'center', padding:'0 3px', background:'#0f172a', flexShrink:'0', borderBottom:'1px solid #475569' } },
        el('div', { style:{ width:'32px', textAlign:'center', fontSize:'10px', fontWeight:'900', color:labelColor, flexShrink:'0' } }, label),
        el('div', { style:{ width:'10px', flexShrink:'0' } }),  // arrow
        el('div', { style:{ width:'26px', flexShrink:'0' } }),  // from
        el('div', { style:{ flex:'1' } }),
        el('div', { style:{ width:'26px', textAlign:'center', fontSize:'9px', fontWeight:'900', color:c0, marginRight:'3px' } }, l0),
        el('div', { style:{ width:'26px', textAlign:'center', fontSize:'9px', fontWeight:'900', color:c1, marginRight:'3px' } }, l1),
        el('div', { style:{ width:'32px', flexShrink:'0' } }),
        el('div', { style:{ width:'14px', flexShrink:'0' } }),
    );
}

function makeRow(key, label, f0, f1, bg0, bg1, isBJ) {
    const fromMap = isBJ ? getBJFromMap() : getBCFromMap();
    const froms   = fromMap[key] || [];
    const hasFrom = froms.length > 0;
    const v0 = data[key][f0], v1 = data[key][f1];
    const fl0 = flash===`${key}_${f0}`, fl1 = flash===`${key}_${f1}`;
    const hasVal = v0>0||v1>0;
    const toOpts = isBJ ? BJPK_SORTED : BC_SORTED;

    const sel = el('select', { disabled: locked, onChange: e => setTo(key, e.target.value) },
        el('option', { value:'' }, 'TO'),
        ...toOpts.map(k => {
            const o = el('option', { value:k }, k);
            if (data[key].to === k) o.selected = true;
            return o;
        })
    );

    return el('div', { className:'row-item', style:{ background: data[key].to?'#1e3a5f':'#1e293b' } },
        // pit 이름 (고정 30px, overflow:visible)
        el('div', { className:'pit-name' }, label),
        // ◀ 화살표 (별도 10px div)
        el('div', { className:'arrow-indicator' }, hasFrom ? '◀' : ''),
        // from 출처 표시 (위아래로)
        el('div', { className:'from-indicator' },
            ...froms.map(f => el('span', {}, f))
        ),
        el('div', { style:{ flex:'1' } }),
        el('div', { className:'count-box flex-center',
            style:{ background:fl0?'#fbbf24':v0>0?bg0:'#0f172a', color:v0>0||fl0?'#fff':'#475569', border:`1px solid ${v0>0?bg0:'#334155'}` },
            onClick: () => tap(key, f0) }, String(v0)),
        el('div', { className:'count-box flex-center',
            style:{ background:fl1?'#fbbf24':v1>0?bg1:'#0f172a', color:v1>0||fl1?'#fff':'#475569', border:`1px solid ${v1>0?bg1:'#334155'}` },
            onClick: () => tap(key, f1) }, String(v1)),
        sel,
        el('div', { className:'reset-zone', onClick: () => resetRow(key, f0, f1) }, !locked&&hasVal?'×':'')
    );
}

function makeGroupedRows(groups, f0, f1, bg0, bg1) {
    const rows = [];
    groups.forEach((group, gi) => {
        if (gi > 0) rows.push(el('div', { className:'group-divider' }));
        group.forEach(t => rows.push(makeRow(`p_${t}`, t, f0, f1, bg0, bg1, false)));
    });
    return rows;
}

function render() {
    const b2=calcBC(F2_LIST,'blue'), r2=calcBC(F2_LIST,'red');
    const b3=calcBC(F3_LIST,'blue'), r3=calcBC(F3_LIST,'red');
    const bj=calcBJ('bj'), pk=calcBJ('pk');
    const total = b2+r2+b3+r3+bj+pk;

    const mkCard = (children, radius='0 0 8px 8px', borderTop='none') =>
        el('div', { style:{ background:'#1e293b', border:'1px solid #334155', borderTop, borderRadius:radius, overflow:'hidden' } }, ...children);

    const subBar = (s0, c0, t0, s1, c1, t1) =>
        el('div', { className:'subtotal-bar' },
            el('div', { style:{ flex:'1', display:'flex', justifyContent:'space-around' } },
                el('span', { style:{ color:c0 } }, `${t0}: ${s0}`),
                el('span', { style:{ color:c1 } }, `${t1}: ${s1}`)
            )
        );

    const leftSec = el('div', { className:'section-container' },
        el('div', { style:{ background:'#0f172a', flexShrink:'0', border:'1px solid #334155', borderBottom:'none', borderRadius:'8px 8px 0 0', overflow:'hidden' } },
            makeColHeader('2F','#94a3b8','BLUE','#60a5fa','RED','#f87171'),
        ),
        el('div', { className:'scroll-area', style:{ background:'#0f172a', padding:'0 0 4px 0' } },
            mkCard([
                ...makeGroupedRows(F2_GROUPS,'blue','red','#2563eb','#dc2626'),
                subBar(b2,'#60a5fa','B', r2,'#f87171','R'),
            ]),
            el('div', { style:{ height:'8px' } }),
            el('div', { style:{ border:'1px solid #334155', borderBottom:'none', borderRadius:'8px 8px 0 0', overflow:'hidden', background:'#0f172a', flexShrink:'0' } },
                makeColHeader('BJ/PK','#34d399','BJ','#34d399','PK','#a78bfa'),
            ),
            mkCard([
                ...BJPK_LIST.map(t => makeRow(`k_${t}`, t, 'bj','pk','#059669','#7c3aed', true)),
                subBar(bj,'#34d399','BJ', pk,'#a78bfa','PK'),
            ])
        )
    );

    const rightSec = el('div', { className:'section-container' },
        el('div', { style:{ background:'#0f172a', flexShrink:'0', border:'1px solid #334155', borderBottom:'none', borderRadius:'8px 8px 0 0', overflow:'hidden' } },
            makeColHeader('3F','#94a3b8','BLUE','#60a5fa','RED','#f87171'),
        ),
        el('div', { className:'scroll-area', style:{ background:'#0f172a' } },
            mkCard([
                ...makeGroupedRows(F3_GROUPS,'blue','red','#2563eb','#dc2626'),
                subBar(b3,'#60a5fa','B', r3,'#f87171','R'),
            ])
        )
    );

    const headerBtns = confirmingReset
        ? [
            el('span', { style:{ fontSize:'11px', color:'#94a3b8' } }, '초기화 하시겠습니까?'),
            el('button', { style:{ padding:'4px 8px', borderRadius:'5px', background:'#ef4444', color:'#fff', fontSize:'11px', fontWeight:'700' }, onClick: doReset }, '확인'),
            el('button', { style:{ padding:'4px 8px', borderRadius:'5px', border:'1px solid #334155', background:'#1e293b', color:'#94a3b8', fontSize:'11px' }, onClick: toggleConfirmReset }, '취소'),
          ]
        : [
            !locked && el('button', { style:{ padding:'4px 8px', borderRadius:'5px', border:'1px solid #334155', background:'#1e293b', color:'#94a3b8', fontSize:'11px' }, onClick: toggleConfirmReset }, 'Reset'),
            el('button', { style:{ padding:'4px 10px', borderRadius:'5px', background:locked?'#334155':'#2563eb', color:locked?'#94a3b8':'#fff', fontWeight:'700', fontSize:'11px' }, onClick: toggleLock }, locked?'Edit':'Done'),
          ];

    const app = el('div', { style:{ height:'100dvh', display:'flex', flexDirection:'column', overflow:'hidden', background:'#0f172a' } },
        el('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'6px 12px', background:'#1e293b', borderBottom:'1px solid #334155', flexShrink:'0' } },
            el('div', { style:{ display:'flex', alignItems:'baseline', gap:'8px' } },
                el('b', { style:{ fontSize:'15px', color:'#e2e8f0' } }, 'Card Manager'),
                el('div', { style:{ background:'#0f172a', color:'#fbbf24', padding:'2px 8px', borderRadius:'5px', fontSize:'14px', fontWeight:'900', border:'1px solid #334155' } },
                    el('span', { style:{ fontSize:'9px', color:'#64748b', marginRight:'4px' } }, 'TOTAL'),
                    String(total)
                )
            ),
            el('div', { style:{ display:'flex', gap:'6px', alignItems:'center' } }, ...headerBtns)
        ),
        el('div', { style:{ flex:'1', display:'flex', gap:'4px', padding:'4px', overflow:'hidden', minHeight:'0' } },
            leftSec, rightSec
        )
    );

    const root = document.getElementById('root');
    root.innerHTML = '';
    root.appendChild(app);
}

render();
</script>
</body>
</html>
